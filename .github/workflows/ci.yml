name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from ADR-019 and the newest stable release, so neither drifts unnoticed.
        # 3.10 is the declared floor since round 4; without it here, `requires-python` and the
        # shims in quest_app/compat.py are a claim nothing tests.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/secret_scan.py scans tracked files, so it needs the index, not history.
          fetch-depth: 1

      # v5, and no dependency cache. This project has no `uv.lock`, and `enable-cache`
      # on v3 resolves `**/uv.lock` and fails the job when it matches nothing — which is
      # how every CI run since 2026-09-18 failed in setup while three audit rounds
      # recorded their gates as green from a developer's machine.
      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python -e ".[dev]"

      # Each step invokes the Makefile target rather than repeating its command, so the
      # Makefile is the single definition and CI cannot drift away from what a developer
      # runs locally. Separate steps so a failure names the check that failed.
      - name: Format check
        run: make format-check
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: YAML safety (ADR-025)
        run: make yaml-safe
      - name: Secret scan
        run: make secret-scan

  # The tests are their own job, split across shards. Run as one step they outgrew GitHub's
  # six-hour job limit once the curriculum reached 128 quests, because many tests run once
  # per quest and each walks that quest's prerequisite chain: the 3.13 job took five hours
  # and the 3.10 and 3.12 jobs were cancelled at six. Each shard runs every eighth test, in
  # node-id order (`--shard-count`, `--shard-index`, tests/conftest.py), so together they run
  # exactly what `make test` runs.
  tests:
    name: tests (${{ matrix.python-version }}, shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Tests (shard ${{ matrix.shard }} of 8)
        run: make test-shard SHARD_COUNT=8 SHARD_INDEX=${{ matrix.shard }}

  # A separate job because it needs a browser. Without it, CI never runs axe, the contrast
  # suite or any keyboard flow — and the accessibility claims would rest on a suite that
  # only ever ran on one developer's machine.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v5, and no dependency cache. This project has no `uv.lock`, and `enable-cache`
      # on v3 resolves `**/uv.lock` and fails the job when it matches nothing — which is
      # how every CI run since 2026-09-18 failed in setup while three audit rounds
      # recorded their gates as green from a developer's machine.
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev,ui]"
          .venv/bin/playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: make test-ui

  clean-export:
    name: Clean export installs and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Export tracked files only, then install, validate and build
        run: make verify-package
