id: context-library
version: 1
title: Context Library
short_title: Context
summary: Build trustworthy local Markdown context that reconciles multiple systems and supports explainable next-work recommendations.
order: 50
accent: amber
icon: library
terrain: library
outcomes:
  - Define a canonical work-item model with required fields, optional fields, and explicit non-goals.
  - Map each source system onto that model without losing source-specific structure, and report what cannot be mapped rather than writing a partial record that looks complete.
  - Give every item an identity that survives renames, moves, and resynchronization, and keep participant analysis separate from synchronized data.
tags: [context, markdown, prioritization]
