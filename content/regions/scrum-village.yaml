title: Scrum Village
short_title: Scrum
summary: Use agentic context to improve planning, flow, team awareness, retrospectives, and stakeholder communication without replacing judgment.
order: 70
accent: green
icon: village
terrain: village
outcomes:
  - Produce team summaries from local canonical context alone, citing the work item and retrieval time behind every statement.
  - Identify blocked work, aging work, and scope change from recorded fields rather than from the language of a title.
  - Separate observed fact from inference, and report missing or stale context as a gap instead of filling it in.
tags: [scrum, organization, reporting]
