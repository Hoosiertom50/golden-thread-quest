[project]
name = "golden-thread-quest"
version = "0.3.1"
description = "The Golden Thread Quest — a local-first training application for the AI Context Engineer Journey."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Runtime dependencies. Each one is justified in docs/DECISIONS.md.
dependencies = [
    'typing_extensions>=4.5; python_version < "3.11"',
    "Jinja2>=3.1.4,<4",       # ADR-006 deterministic server-side rendering
    "PyYAML>=6.0.1,<7",       # ADR-025 safe_load only
    # ADR-020 validates against the published schemas. The [format] extra is not optional:
    # without it FormatChecker silently has no date-time checker, so `format: date-time`
    # validates nothing and a timestamp of "banana" passes (Stage 2 audit H6).
    "jsonschema[format]>=4.21,<5",
    "markdown-it-py>=3.0,<4", # ADR-021 CommonMark
    "nh3>=0.2.17,<0.4",       # ADR-021 allowlist sanitization
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    # Pinned to one minor. `make check` runs the formatter as a gate, and a formatter that
    # may change its mind between installs makes that gate report on the install rather than
    # on the code: round 4 found `make check` failing on a clean clone of an untouched commit.
    "ruff>=0.16,<0.17",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
    "tomli>=2,<3; python_version < '3.11'",
]
ui = [
    "pytest-playwright>=0.5",
    "playwright>=1.46",
]
# Only `scripts/build_user_guide_html.py` needs this: it re-encodes the diagrams as WebP data
# URIs so the guide is one self-contained file. Nothing the application ships imports it.
docs = [
    "pillow>=10,<12",
]

[project.scripts]
# Registered per stage, so an installed command always exists. `quest-build` and
# `quest-serve` are added with the generator and the local service. `quest-app` is the one
# the guides tell participants and reviewers to run, and it went unregistered for a release
# because every test invoked `python -m quest_app.cli` instead of the installed command.
quest-app = "quest_app.cli:main"
quest-validate = "quest_app.cli:validate_main"
quest-build = "quest_app.cli:build_main"
quest-serve = "quest_app.cli:serve_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quest_app", "validators"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["quest_app", "validators", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = [
    "S101",  # assert is how pytest expresses expectations
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately contain fake secrets and temp paths, and several tests drive
# real git with fixed argument lists to prove the safety claims about it.
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]

[tool.ruff.lint.flake8-bandit]
# yaml.safe_load is required (ADR-025); yaml.load is caught by tools/check_yaml_safe.py too.

[tool.mypy]
# Round 17 F10: the declared floor, so a 3.11-only API is flagged.
python_version = "3.10"
strict = true
files = ["quest_app", "validators", "tools"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["nh3.*", "markdown_it.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "ui: browser-driven tests requiring Playwright (deselect with -m 'not ui')",
    "slow: tests that build the whole site",
]
filterwarnings = ["error::DeprecationWarning:quest_app.*"]
